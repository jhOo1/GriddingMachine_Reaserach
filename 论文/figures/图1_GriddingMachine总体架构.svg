<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760">
  <defs>
    <style>
      .sans{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
      .mono{font-family:Consolas,"Courier New",monospace}
      .panel{font-size:26px;font-weight:700;fill:#17212b}
      .node-title{font-size:22px;font-weight:700;fill:#17212b}
      .node-sub{font-size:17px;fill:#52616d}
      .base-title{font-size:21px;font-weight:700;fill:#65717a}
      .base-sub{font-size:17px;fill:#7c8790}
      .opt-title{font-size:20px;font-weight:700;fill:#8f5311}
      .opt-sub{font-size:17px;fill:#384650}
      .note{font-size:15px;fill:#68757e}
      .box{fill:#fff;stroke:#315d7d;stroke-width:2}
      .basebox{fill:#f7f8f9;stroke:#a7afb5;stroke-width:1.5}
      .flow{fill:none;stroke:#315d7d;stroke-width:2.2;marker-end:url(#arrow)}
      .baseflow{fill:none;stroke:#a7afb5;stroke-width:1.6;marker-end:url(#arrow-gray)}
      .change{fill:none;stroke:#bd711e;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#arrow-orange)}
      .guide{stroke:#d6dce0;stroke-width:1}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#315d7d"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a7afb5"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#bd711e"/>
    </marker>
  </defs>

  <rect width="1800" height="760" fill="#fff"/>

  <!-- (a) 2022 baseline -->
  <text x="56" y="58" class="sans panel">(a) 2022年基线</text>
  <line x1="56" y1="76" x2="1744" y2="76" class="guide"/>

  <g class="sans">
    <rect x="82" y="110" width="250" height="96" class="basebox"/>
    <text x="207" y="148" text-anchor="middle" class="base-title">多源网格数据</text>
    <text x="207" y="176" text-anchor="middle" class="base-sub">数据集特定的结构与约定</text>

    <rect x="420" y="110" width="250" height="96" class="basebox"/>
    <text x="545" y="148" text-anchor="middle" class="base-title">专用预处理脚本</text>
    <text x="545" y="176" text-anchor="middle" class="base-sub">配置与处理逻辑分散</text>

    <rect x="758" y="110" width="250" height="96" class="basebox"/>
    <text x="883" y="148" text-anchor="middle" class="base-title">tar.gz 数据制品</text>
    <text x="883" y="176" text-anchor="middle" class="base-sub">外层归档后再分发</text>

    <rect x="1096" y="110" width="250" height="96" class="basebox"/>
    <text x="1221" y="148" text-anchor="middle" class="base-title">包内数据目录</text>
    <text x="1221" y="176" text-anchor="middle" class="base-sub mono">Artifacts.toml</text>

    <rect x="1434" y="110" width="250" height="96" class="basebox"/>
    <text x="1559" y="148" text-anchor="middle" class="base-title">数据读取与应用</text>
    <text x="1559" y="176" text-anchor="middle" class="base-sub mono">read_LUT</text>
  </g>
  <path d="M332 158H412" class="baseflow"/>
  <path d="M670 158H750" class="baseflow"/>
  <path d="M1008 158H1088" class="baseflow"/>
  <path d="M1346 158H1426" class="baseflow"/>

  <!-- vertical change links -->
  <path d="M545 206V286" class="change"/>
  <path d="M883 206V286" class="change"/>
  <path d="M1221 206V286" class="change"/>
  <path d="M1559 206V286" class="change"/>

  <!-- (b) updated workflow -->
  <text x="56" y="276" class="sans panel">(b) 新版端到端工作流</text>
  <line x1="56" y1="294" x2="1744" y2="294" class="guide"/>

  <g class="sans">
    <rect x="56" y="326" width="205" height="126" class="box"/>
    <text x="80" y="354" class="node-sub">01</text>
    <text x="158" y="377" text-anchor="middle" class="node-title">异构源数据</text>
    <text x="158" y="405" text-anchor="middle" class="node-sub mono">NetCDF / GeoTIFF</text>

    <rect x="303" y="326" width="205" height="126" class="box"/>
    <text x="327" y="354" class="node-sub">02</text>
    <text x="405" y="377" text-anchor="middle" class="node-title">共享YAML契约</text>
    <text x="405" y="405" text-anchor="middle" class="node-sub mono">schema · dimensions</text>

    <rect x="550" y="326" width="205" height="126" class="box"/>
    <text x="574" y="354" class="node-sub">03</text>
    <text x="652" y="377" text-anchor="middle" class="node-title">标准化与质控</text>
    <text x="652" y="405" text-anchor="middle" class="node-sub mono">process_dataset!</text>

    <rect x="797" y="326" width="205" height="126" class="box"/>
    <text x="821" y="354" class="node-sub">04</text>
    <text x="899" y="377" text-anchor="middle" class="node-title">标准数据产品</text>
    <text x="899" y="405" text-anchor="middle" class="node-sub mono">TAG.nc</text>
    <text x="899" y="429" text-anchor="middle" class="node-sub">直接分发</text>

    <rect x="1044" y="326" width="205" height="126" class="box"/>
    <text x="1068" y="354" class="node-sub">05</text>
    <text x="1146" y="377" text-anchor="middle" class="node-title">独立数据目录</text>
    <text x="1146" y="405" text-anchor="middle" class="node-sub mono">URL · SIZE · SHA-256</text>
    <text x="1146" y="429" text-anchor="middle" class="node-sub">FTP / Zenodo</text>

    <rect x="1291" y="326" width="205" height="126" class="box"/>
    <text x="1315" y="354" class="node-sub">06</text>
    <text x="1393" y="377" text-anchor="middle" class="node-title">安全获取与落盘</text>
    <text x="1393" y="405" text-anchor="middle" class="node-sub mono">cache / .part</text>
    <text x="1393" y="429" text-anchor="middle" class="node-sub mono">verify → public</text>

    <rect x="1538" y="326" width="205" height="126" class="box"/>
    <text x="1562" y="354" class="node-sub">07</text>
    <text x="1640" y="377" text-anchor="middle" class="node-title">统一读取与模型调用</text>
    <text x="1640" y="405" text-anchor="middle" class="node-sub mono">read_dataset</text>
    <text x="1640" y="429" text-anchor="middle" class="node-sub">模型输入字典</text>
  </g>
  <path d="M261 389H295" class="flow"/>
  <path d="M508 389H542" class="flow"/>
  <path d="M755 389H789" class="flow"/>
  <path d="M1002 389H1036" class="flow"/>
  <path d="M1249 389H1283" class="flow"/>
  <path d="M1496 389H1530" class="flow"/>

  <!-- (c) optimization callouts -->
  <text x="56" y="515" class="sans panel">(c) 关键优化</text>
  <line x1="56" y1="533" x2="1744" y2="533" class="guide"/>

  <g class="sans">
    <circle cx="178" cy="590" r="24" fill="#fff" stroke="#bd711e" stroke-width="2"/>
    <text x="178" y="596" text-anchor="middle" class="opt-title">O1</text>
    <text x="218" y="581" class="opt-title">统一数据契约</text>
    <text x="218" y="607" class="opt-sub">显式声明维度与处理语义</text>

    <circle cx="536" cy="590" r="24" fill="#fff" stroke="#bd711e" stroke-width="2"/>
    <text x="536" y="596" text-anchor="middle" class="opt-title">O2</text>
    <text x="576" y="581" class="opt-title">简化数据制品</text>
    <text x="576" y="607" class="opt-sub">取消外层tar.gz，直接发布NetCDF</text>

    <circle cx="894" cy="590" r="24" fill="#fff" stroke="#bd711e" stroke-width="2"/>
    <text x="894" y="596" text-anchor="middle" class="opt-title">O3</text>
    <text x="934" y="581" class="opt-title">目录独立演化</text>
    <text x="934" y="607" class="opt-sub">目录独立更新，镜像可校验</text>

    <circle cx="1252" cy="590" r="24" fill="#fff" stroke="#bd711e" stroke-width="2"/>
    <text x="1252" y="596" text-anchor="middle" class="opt-title">O4</text>
    <text x="1292" y="581" class="opt-title">事务式下载</text>
    <text x="1292" y="607" class="opt-sub">失败回退与校验后落盘</text>

    <circle cx="1550" cy="590" r="24" fill="#fff" stroke="#bd711e" stroke-width="2"/>
    <text x="1550" y="596" text-anchor="middle" class="opt-title">O5</text>
    <text x="1590" y="581" class="opt-title">模型就绪接口</text>
    <text x="1590" y="607" class="opt-sub">统一读取并组织模型输入</text>
  </g>

  <path d="M405 452V548H178V558" class="change"/>
  <path d="M899 452V518H536V558" class="change"/>
  <path d="M1146 452V548H894V558" class="change"/>
  <path d="M1393 452V548H1252V558" class="change"/>
  <path d="M1640 452V526H1550V558" class="change"/>

  <line x1="56" y1="674" x2="1744" y2="674" class="guide"/>
  <text x="56" y="704" class="sans note">蓝色实线：新版核心数据路径　　橙色虚线：相对2022版的改进映射　　灰色：2022版基线</text>
  <text x="56" y="730" class="sans note">范围：本地数据生产、分发与模型调用；Server/Requestor远程子集服务不属于本文核心内容。</text>
</svg>
