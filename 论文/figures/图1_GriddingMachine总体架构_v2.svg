    <rect x="348" y="812" width="292" height="86" rx="9" class="opt-card"/><circle cx="378" cy="842" r="20" fill="#fff" stroke="#c87524" stroke-width="2"/><text x="378" y="849" text-anchor="middle" class="opt-title">O2</text><text x="410" y="838" class="opt-title">直接NetCDF</text><text x="410" y="866" class="opt-sub">简化制品与读取路径</text>
    <rect x="654" y="812" width="292" height="86" rx="9" class="opt-card"/><circle cx="684" cy="842" r="20" fill="#fff" stroke="#c87524" stroke-width="2"/><text x="684" y="849" text-anchor="middle" class="opt-title">O3</text><text x="716" y="838" class="opt-title">目录独立演化</text><text x="716" y="866" class="opt-sub">版本与镜像解耦更新</text>
    <rect x="960" y="812" width="292" height="86" rx="9" class="opt-card"/><circle cx="990" cy="842" r="20" fill="#fff" stroke="#c87524" stroke-width="2"/><text x="990" y="849" text-anchor="middle" class="opt-title">O4</text><text x="1022" y="838" class="opt-title">事务式获取</text><text x="1022" y="866" class="opt-sub">顺序回退与校验落盘</text>
    <rect x="1266" y="812" width="292" height="86" rx="9" class="opt-card"/><circle cx="1296" cy="842" r="20" fill="#fff" stroke="#c87524" stroke-width="2"/><text x="1296" y="849" text-anchor="middle" class="opt-title">O5</text><text x="1328" y="838" class="opt-title">模型就绪接口</text><text x="1328" y="866" class="opt-sub">统一读取与输入组织</text>
  </g>
</svg>
