  <path d="M1404 441V463" class="app-flow"/><path d="M1404 561V583" class="app-flow"/>
  <path d="M1404 677V731H167V595" class="feedback"/><rect x="610" y="716" width="360" height="28" rx="14" fill="#fff"/><text x="790" y="736" text-anchor="middle" class="sans legend">版本反馈 · 元数据完善 · 新增数据需求</text>

  <text x="42" y="778" class="sans panel">(c) 五项核心更新</text><line x1="42" y1="794" x2="1558" y2="794" class="guide"/>
  <g class="sans">
